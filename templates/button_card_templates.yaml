# Einmalig in die Rohkonfiguration eines Dashboards übernehmen.
button_card_templates:
  harmony_base:
    show_name: true
    show_icon: true
    show_label: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
      - border-radius: var(--harmony-card-radius, 22px)
      - padding: var(--harmony-card-padding, 16px)
      - box-shadow: var(--harmony-card-shadow, none)
      - background: var(--harmony-card-surface, var(--card-background-color))
      - border: var(--harmony-card-border, 1px solid var(--divider-color))
      - box-sizing: border-box
      - height: 100%
      - min-height: 84px
      grid:
      - grid-template-areas: '"i n" "i l"'
      - grid-template-columns: 40px minmax(0,1fr)
      - column-gap: 12px
      img_cell:
      - width: 40px
      - height: 40px
      - justify-self: start
      - border-radius: var(--harmony-icon-radius,13px)
      - background: var(--harmony-icon-surface)
      icon:
      - width: 24px
      - color: var(--harmony-tone, var(--primary-color))
      name:
      - justify-self: start
      - text-align: left
      - font-size: var(--harmony-title-size,14px)
      - font-weight: 500
      - white-space: normal
      label:
      - justify-self: start
      - text-align: left
      - font-size: var(--harmony-secondary-size,12px)
      - color: var(--secondary-text-color)
      - white-space: pre-line
      - line-height: '1.45'
      - overflow-wrap: anywhere
  harmony_metric:
    template: harmony_base
    show_state: true
    variables:
      harmony_kind: generic
      harmony_unit: ''
      harmony_decimals: 1
      harmony_note: ''
    state_display: "[[[\nconst raw = entity?.state;\nconst n = typeof raw === 'string' && raw.trim() !== '' ? Number(raw)\
      \ : NaN;\nconst kind = variables.harmony_kind || 'generic';\nconst restored = entity?.attributes?.restored === true;\n\
      const numeric = Number.isFinite(n);\nconst plausible = numeric && (kind === 'temperature' ? n >= -273.15\n  : kind ===\
      \ 'humidity' ? n >= 0 && n <= 100\n  : kind === 'co2' ? n >= 1 && n <= 1000000\n  : kind === 'pm25' ? n >= 0 : true);\n\
      let reason = restored ? 'Status wird geladen' : !entity || raw === 'unknown' ? 'Keine Daten'\n  : raw === 'unavailable'\
      \ ? 'Offline' : !numeric ? 'Messwert ungültig'\n  : !plausible ? 'Wert unplausibel' : '';\nlet tone = 'var(--secondary-text-color)';\n\
      let status = reason;\nif (!reason) {\n  if (kind === 'temperature') {\n    tone = n > 28 ? 'var(--harmony-error)' :\
      \ n > 25 ? 'var(--harmony-gold)' : 'var(--harmony-peach)';\n    status = variables.harmony_note || 'Raumtemperatur';\n\
      \  } else if (kind === 'humidity') {\n    tone = n > 70 ? 'var(--harmony-error)' : n < 30 || n > 60 ? 'var(--harmony-gold)'\
      \ : 'var(--harmony-cyan)';\n    status = n < 30 ? 'Trocken' : n <= 60 ? 'Gut' : n <= 70 ? 'Erhöht' : 'Hoch';\n  } else\
      \ if (kind === 'pm25') {\n    tone = n > 35 ? 'var(--harmony-error)' : n > 20 ? 'var(--harmony-peach)' : n > 10 ? 'var(--harmony-gold)'\
      \ : 'var(--harmony-mint)';\n    status = n <= 5 ? 'Sehr gut' : n <= 10 ? 'Gut' : n <= 20 ? 'Erhöht' : n <= 35 ? 'Schlecht'\
      \ : 'Sehr schlecht';\n  } else if (kind === 'co2') {\n    const warning = variables.harmony_co2_warning ?? 800;\n  \
      \  const high = variables.harmony_co2_high ?? 1200;\n    const alarm = variables.harmony_co2_alarm ?? 1600;\n    tone\
      \ = n >= alarm ? 'var(--harmony-error)' : n >= high ? 'var(--harmony-peach)' : n >= warning ? 'var(--harmony-gold)'\
      \ : 'var(--harmony-mint)';\n    status = n >= alarm ? 'Lüften!' : n >= high ? 'Schlecht' : n >= warning ? 'Erhöht' :\
      \ 'Gut';\n  } else {\n    tone = 'var(--harmony-blue)';\n    status = variables.harmony_note || '';\n  }\n}\nif (reason)\
      \ return reason;\nreturn n.toLocaleString(variables.harmony_locale || 'de-CH', {minimumFractionDigits: variables.harmony_decimals\
      \ ?? 1, maximumFractionDigits: variables.harmony_decimals ?? 1}) + (variables.harmony_unit ? ' ' + variables.harmony_unit\
      \ : '');\n]]]"
    label: "[[[\nconst raw = entity?.state;\nconst n = typeof raw === 'string' && raw.trim() !== '' ? Number(raw) : NaN;\n\
      const kind = variables.harmony_kind || 'generic';\nconst restored = entity?.attributes?.restored === true;\nconst numeric\
      \ = Number.isFinite(n);\nconst plausible = numeric && (kind === 'temperature' ? n >= -273.15\n  : kind === 'humidity'\
      \ ? n >= 0 && n <= 100\n  : kind === 'co2' ? n >= 1 && n <= 1000000\n  : kind === 'pm25' ? n >= 0 : true);\nlet reason\
      \ = restored ? 'Status wird geladen' : !entity || raw === 'unknown' ? 'Keine Daten'\n  : raw === 'unavailable' ? 'Offline'\
      \ : !numeric ? 'Messwert ungültig'\n  : !plausible ? 'Wert unplausibel' : '';\nlet tone = 'var(--secondary-text-color)';\n\
      let status = reason;\nif (!reason) {\n  if (kind === 'temperature') {\n    tone = n > 28 ? 'var(--harmony-error)' :\
      \ n > 25 ? 'var(--harmony-gold)' : 'var(--harmony-peach)';\n    status = variables.harmony_note || 'Raumtemperatur';\n\
      \  } else if (kind === 'humidity') {\n    tone = n > 70 ? 'var(--harmony-error)' : n < 30 || n > 60 ? 'var(--harmony-gold)'\
      \ : 'var(--harmony-cyan)';\n    status = n < 30 ? 'Trocken' : n <= 60 ? 'Gut' : n <= 70 ? 'Erhöht' : 'Hoch';\n  } else\
      \ if (kind === 'pm25') {\n    tone = n > 35 ? 'var(--harmony-error)' : n > 20 ? 'var(--harmony-peach)' : n > 10 ? 'var(--harmony-gold)'\
      \ : 'var(--harmony-mint)';\n    status = n <= 5 ? 'Sehr gut' : n <= 10 ? 'Gut' : n <= 20 ? 'Erhöht' : n <= 35 ? 'Schlecht'\
      \ : 'Sehr schlecht';\n  } else if (kind === 'co2') {\n    const warning = variables.harmony_co2_warning ?? 800;\n  \
      \  const high = variables.harmony_co2_high ?? 1200;\n    const alarm = variables.harmony_co2_alarm ?? 1600;\n    tone\
      \ = n >= alarm ? 'var(--harmony-error)' : n >= high ? 'var(--harmony-peach)' : n >= warning ? 'var(--harmony-gold)'\
      \ : 'var(--harmony-mint)';\n    status = n >= alarm ? 'Lüften!' : n >= high ? 'Schlecht' : n >= warning ? 'Erhöht' :\
      \ 'Gut';\n  } else {\n    tone = 'var(--harmony-blue)';\n    status = variables.harmony_note || '';\n  }\n}\nreturn\
      \ status;\n]]]"
    styles:
      card:
      - --harmony-tone: "[[[\nconst raw = entity?.state;\nconst n = typeof raw === 'string' && raw.trim() !== '' ? Number(raw)\
          \ : NaN;\nconst kind = variables.harmony_kind || 'generic';\nconst restored = entity?.attributes?.restored === true;\n\
          const numeric = Number.isFinite(n);\nconst plausible = numeric && (kind === 'temperature' ? n >= -273.15\n  : kind\
          \ === 'humidity' ? n >= 0 && n <= 100\n  : kind === 'co2' ? n >= 1 && n <= 1000000\n  : kind === 'pm25' ? n >= 0\
          \ : true);\nlet reason = restored ? 'Status wird geladen' : !entity || raw === 'unknown' ? 'Keine Daten'\n  : raw\
          \ === 'unavailable' ? 'Offline' : !numeric ? 'Messwert ungültig'\n  : !plausible ? 'Wert unplausibel' : '';\nlet\
          \ tone = 'var(--secondary-text-color)';\nlet status = reason;\nif (!reason) {\n  if (kind === 'temperature') {\n\
          \    tone = n > 28 ? 'var(--harmony-error)' : n > 25 ? 'var(--harmony-gold)' : 'var(--harmony-peach)';\n    status\
          \ = variables.harmony_note || 'Raumtemperatur';\n  } else if (kind === 'humidity') {\n    tone = n > 70 ? 'var(--harmony-error)'\
          \ : n < 30 || n > 60 ? 'var(--harmony-gold)' : 'var(--harmony-cyan)';\n    status = n < 30 ? 'Trocken' : n <= 60\
          \ ? 'Gut' : n <= 70 ? 'Erhöht' : 'Hoch';\n  } else if (kind === 'pm25') {\n    tone = n > 35 ? 'var(--harmony-error)'\
          \ : n > 20 ? 'var(--harmony-peach)' : n > 10 ? 'var(--harmony-gold)' : 'var(--harmony-mint)';\n    status = n <=\
          \ 5 ? 'Sehr gut' : n <= 10 ? 'Gut' : n <= 20 ? 'Erhöht' : n <= 35 ? 'Schlecht' : 'Sehr schlecht';\n  } else if (kind\
          \ === 'co2') {\n    const warning = variables.harmony_co2_warning ?? 800;\n    const high = variables.harmony_co2_high\
          \ ?? 1200;\n    const alarm = variables.harmony_co2_alarm ?? 1600;\n    tone = n >= alarm ? 'var(--harmony-error)'\
          \ : n >= high ? 'var(--harmony-peach)' : n >= warning ? 'var(--harmony-gold)' : 'var(--harmony-mint)';\n    status\
          \ = n >= alarm ? 'Lüften!' : n >= high ? 'Schlecht' : n >= warning ? 'Erhöht' : 'Gut';\n  } else {\n    tone = 'var(--harmony-blue)';\n\
          \    status = variables.harmony_note || '';\n  }\n}\nreturn tone;\n]]]"
      - padding: var(--harmony-card-padding,16px) var(--harmony-card-padding,16px) 0
      - min-height: 150px
      - overflow: hidden
      - background: var(--harmony-metric-surface, var(--card-background-color))
      grid:
      - grid-template-areas: '"i n" "s s" "l l"'
      - grid-template-columns: 30px minmax(0,1fr)
      - grid-template-rows: 30px minmax(34px,auto) auto
      - column-gap: 8px
      - row-gap: 10px
      img_cell:
      - width: 30px
      - height: 30px
      - border-radius: 10px
      icon:
      - width: 19px
      name:
      - font-size: 13px
      - color: var(--secondary-text-color)
      state:
      - justify-self: start
      - text-align: left
      - font-size: "[[[\nconst raw = entity?.state;\nconst n = typeof raw === 'string' && raw.trim() !== '' ? Number(raw)\
          \ : NaN;\nconst kind = variables.harmony_kind || 'generic';\nconst restored = entity?.attributes?.restored === true;\n\
          const numeric = Number.isFinite(n);\nconst plausible = numeric && (kind === 'temperature' ? n >= -273.15\n  : kind\
          \ === 'humidity' ? n >= 0 && n <= 100\n  : kind === 'co2' ? n >= 1 && n <= 1000000\n  : kind === 'pm25' ? n >= 0\
          \ : true);\nlet reason = restored ? 'Status wird geladen' : !entity || raw === 'unknown' ? 'Keine Daten'\n  : raw\
          \ === 'unavailable' ? 'Offline' : !numeric ? 'Messwert ungültig'\n  : !plausible ? 'Wert unplausibel' : '';\nlet\
          \ tone = 'var(--secondary-text-color)';\nlet status = reason;\nif (!reason) {\n  if (kind === 'temperature') {\n\
          \    tone = n > 28 ? 'var(--harmony-error)' : n > 25 ? 'var(--harmony-gold)' : 'var(--harmony-peach)';\n    status\
          \ = variables.harmony_note || 'Raumtemperatur';\n  } else if (kind === 'humidity') {\n    tone = n > 70 ? 'var(--harmony-error)'\
          \ : n < 30 || n > 60 ? 'var(--harmony-gold)' : 'var(--harmony-cyan)';\n    status = n < 30 ? 'Trocken' : n <= 60\
          \ ? 'Gut' : n <= 70 ? 'Erhöht' : 'Hoch';\n  } else if (kind === 'pm25') {\n    tone = n > 35 ? 'var(--harmony-error)'\
          \ : n > 20 ? 'var(--harmony-peach)' : n > 10 ? 'var(--harmony-gold)' : 'var(--harmony-mint)';\n    status = n <=\
          \ 5 ? 'Sehr gut' : n <= 10 ? 'Gut' : n <= 20 ? 'Erhöht' : n <= 35 ? 'Schlecht' : 'Sehr schlecht';\n  } else if (kind\
          \ === 'co2') {\n    const warning = variables.harmony_co2_warning ?? 800;\n    const high = variables.harmony_co2_high\
          \ ?? 1200;\n    const alarm = variables.harmony_co2_alarm ?? 1600;\n    tone = n >= alarm ? 'var(--harmony-error)'\
          \ : n >= high ? 'var(--harmony-peach)' : n >= warning ? 'var(--harmony-gold)' : 'var(--harmony-mint)';\n    status\
          \ = n >= alarm ? 'Lüften!' : n >= high ? 'Schlecht' : n >= warning ? 'Erhöht' : 'Gut';\n  } else {\n    tone = 'var(--harmony-blue)';\n\
          \    status = variables.harmony_note || '';\n  }\n}\nreturn reason ? '16px' : 'var(--harmony-value-size,26px)';\n\
          ]]]"
      - font-weight: 500
      - line-height: '1.25'
      - letter-spacing: -0.03em
      - color: var(--harmony-tone)
      - white-space: normal
      label:
      - align-self: end
      - background: var(--harmony-footer-surface)
      - color: var(--harmony-tone)
      - margin: 0 calc(-1 * var(--harmony-card-padding,16px))
      - width: calc(100% + 2 * var(--harmony-card-padding,16px))
      - max-width: none
      - padding: 8px var(--harmony-card-padding,16px)
      - font-size: var(--harmony-secondary-size,12px)
      - min-height: 33px
      - box-sizing: border-box
